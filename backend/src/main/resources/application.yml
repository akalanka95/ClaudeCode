spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interviewprep}
    username: ${SPRING_DATASOURCE_USERNAME:interviewprep}
    password: ${SPRING_DATASOURCE_PASSWORD:interviewprep}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  sync-agent:
    base-url: ${APP_SYNC_AGENT_BASE_URL:http://127.0.0.1:4100}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
  voyage:
    api-key: ${VOYAGE_API_KEY:}
  qdrant:
    host: ${APP_QDRANT_HOST:localhost}
    grpc-port: ${APP_QDRANT_GRPC_PORT:6334}
    use-tls: ${APP_QDRANT_USE_TLS:false}
    api-key: ${APP_QDRANT_API_KEY:}

server:
  port: ${PORT:8080}
