spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/interviewprep
    username: interviewprep
    password: interviewprep
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-5

app:
  cors:
    allowed-origin: http://localhost:5173

server:
  port: 8080
