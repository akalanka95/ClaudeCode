services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: interviewprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interviewprep
      SPRING_DATASOURCE_USERNAME: interviewprep
      SPRING_DATASOURCE_PASSWORD: interviewprep
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_GRPC_PORT: 6334
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_ENABLE_SYNC: "false"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrantdata:
