services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: interviewprep
      POSTGRES_PASSWORD: interviewprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interviewprep
      SPRING_DATASOURCE_USERNAME: interviewprep
      SPRING_DATASOURCE_PASSWORD: interviewprep
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_ENABLE_SYNC: "false"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
